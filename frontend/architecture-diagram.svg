<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16537e" />
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="560" fill="#f2f4f6" />

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#0f3a58">Resume Chatbot — RAG Architecture on AWS</text>

  <!-- Frontend -->
  <rect x="230" y="52" width="260" height="46" rx="8" fill="#16537e" />
  <text x="360" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Frontend — S3 + CloudFront (HTTPS)</text>

  <line x1="360" y1="98" x2="360" y2="128" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- API Gateway -->
  <rect x="230" y="130" width="260" height="46" rx="8" fill="#ffffff" stroke="#16537e" stroke-width="1.5" />
  <text x="360" y="153" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">API Gateway (HTTP API)</text>
  <text x="360" y="168" text-anchor="middle" font-size="10.5" fill="#6b7280">POST /chat · GET /faq · GET /health</text>

  <line x1="360" y1="176" x2="360" y2="206" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Lambda -->
  <rect x="230" y="208" width="260" height="46" rx="8" fill="#ffffff" stroke="#16537e" stroke-width="1.5" />
  <text x="360" y="231" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">Lambda (Python 3.12)</text>
  <text x="360" y="246" text-anchor="middle" font-size="10.5" fill="#6b7280">Guardrails · session cost cap · JD-fit fetch</text>

  <!-- Fan-out lines to three services -->
  <line x1="300" y1="254" x2="140" y2="300" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="360" y1="254" x2="360" y2="300" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="420" y1="254" x2="580" y2="300" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Bedrock KB (Retrieve) -->
  <rect x="30" y="302" width="220" height="52" rx="8" fill="#eef1f4" stroke="#16537e" stroke-width="1.5" />
  <text x="140" y="323" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">Bedrock Knowledge Base</text>
  <text x="140" y="338" text-anchor="middle" font-size="10.5" fill="#6b7280">Retrieve / RetrieveAndGenerate</text>
  <text x="140" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">returns cited source chunks</text>

  <!-- Bedrock Claude -->
  <rect x="250" y="302" width="220" height="52" rx="8" fill="#eef1f4" stroke="#16537e" stroke-width="1.5" />
  <text x="360" y="323" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">Bedrock Claude</text>
  <text x="360" y="338" text-anchor="middle" font-size="10.5" fill="#6b7280">Sonnet 4.6, generation</text>
  <text x="360" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">grounded on retrieved chunks</text>

  <!-- DynamoDB -->
  <rect x="470" y="302" width="220" height="52" rx="8" fill="#eef1f4" stroke="#16537e" stroke-width="1.5" />
  <text x="580" y="323" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">DynamoDB</text>
  <text x="580" y="338" text-anchor="middle" font-size="10.5" fill="#6b7280">Q&amp;A log · FAQ counters</text>
  <text x="580" y="350" text-anchor="middle" font-size="10.5" fill="#6b7280">per-session cost total</text>

  <line x1="140" y1="354" x2="140" y2="384" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- S3 Vectors -->
  <rect x="30" y="386" width="220" height="42" rx="8" fill="#ffffff" stroke="#16537e" stroke-width="1.5" />
  <text x="140" y="406" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">S3 Vectors</text>
  <text x="140" y="420" text-anchor="middle" font-size="10.5" fill="#6b7280">embeddings index (Titan Text Embed)</text>

  <line x1="140" y1="428" x2="140" y2="458" stroke="#16537e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- S3 markdown source -->
  <rect x="30" y="460" width="220" height="42" rx="8" fill="#ffffff" stroke="#16537e" stroke-width="1.5" />
  <text x="140" y="480" text-anchor="middle" font-size="12" fill="#0f3a58" font-weight="600">S3 — Knowledge Base source</text>
  <text x="140" y="494" text-anchor="middle" font-size="10.5" fill="#6b7280">markdown files, one per topic</text>

  <text x="360" y="530" text-anchor="middle" font-size="10.5" fill="#6b7280">Cost gates (not shown): AWS Budget hard-stop · API throttling · $2/session cap</text>
  <text x="360" y="546" text-anchor="middle" font-size="10.5" fill="#6b7280">S3 Vectors chosen over OpenSearch Serverless to avoid its $345–700/mo OCU minimum</text>
</svg>
